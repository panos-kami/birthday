<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kami</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f5efe7;
}


/* ==========================================
   FIRST SCREEN
   Completely different from the birthday
========================================== */

#gate{

  position:fixed;
  inset:0;

  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 40%,
      #ffffff 0%,
      #f5efe7 60%,
      #ebe1d6 100%
    );

  color:#161616;

  transition:
    opacity .7s ease,
    transform .9s cubic-bezier(.2,.8,.2,1),
    visibility .7s ease;
}


#gate.leave{

  opacity:0;

  transform:
    scale(1.12);

  visibility:hidden;

}


.gateInner{
  text-align:center;
}


.gateTitle{

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(
      48px,
      8vw,
      105px
    );

  font-weight:400;

  letter-spacing:-.04em;
}


#yesButton{

  margin-top:38px;

  border:
    1px solid
    rgba(0,0,0,.25);

  background:
    transparent;

  color:#161616;

  padding:
    14px 38px;

  border-radius:100px;

  font-size:14px;

  letter-spacing:.20em;

  cursor:pointer;

  transition:.3s ease;

}


#yesButton:hover{

  background:#161616;

  color:white;

  transform:
    scale(1.05);

}



/* ==========================================
   MAIN CINEMA WORLD
========================================== */

#world{

  position:fixed;
  inset:0;

  overflow:hidden;

  perspective:1600px;

  background:
    radial-gradient(
      circle at 50% 19%,
      rgba(255,234,166,.42),
      transparent 20%
    ),

    radial-gradient(
      circle at 10% 75%,
      rgba(250,122,191,.30),
      transparent 32%
    ),

    radial-gradient(
      circle at 90% 28%,
      rgba(110,128,255,.38),
      transparent 36%
    ),

    linear-gradient(
      145deg,
      #13245a 0%,
      #294b9a 32%,
      #7058b8 65%,
      #cf76aa 100%
    );

}


/* initial blackout while changing worlds */

#blackout{

  position:absolute;
  inset:0;

  z-index:100;

  background:#10152f;

  opacity:1;

  pointer-events:none;

  transition:
    opacity 1.1s ease;

}


#blackout.remove{
  opacity:0;
}



/* ==========================================
   MOVING BACKGROUND
========================================== */

.haze{

  position:absolute;

  inset:-25%;

  filter:
    blur(75px);

  opacity:.58;

}


.haze1{

  background:
    radial-gradient(
      circle at 25% 45%,
      rgba(255,178,214,.72),
      transparent 31%
    );

  animation:
    hazeA
    11s
    ease-in-out
    infinite alternate;

}


.haze2{

  background:
    radial-gradient(
      circle at 72% 38%,
      rgba(103,130,255,.62),
      transparent 33%
    );

  animation:
    hazeB
    13s
    ease-in-out
    infinite alternate;

}


@keyframes hazeA{

  to{
    transform:
      translate(
        7%,
        -4%
      )
      scale(1.08);
  }

}


@keyframes hazeB{

  to{
    transform:
      translate(
        -6%,
        5%
      )
      scale(1.12);
  }

}



/* ==========================================
   PARTICLES
========================================== */

.spark{

  position:absolute;

  width:4px;
  height:4px;

  border-radius:50%;

  background:#fff5c8;

  box-shadow:
    0 0 12px
    4px
    rgba(255,225,146,.55);

  opacity:0;

  animation:
    twinkle
    4s
    ease-in-out
    infinite;

}


@keyframes twinkle{

  0%,
  100%{

    opacity:0;

    transform:
      scale(.3);

  }


  50%{

    opacity:1;

    transform:
      scale(1.3);

  }

}



/* ==========================================
   SEARCHLIGHTS
========================================== */

.light{

  position:absolute;

  bottom:-45%;

  width:280px;

  height:160%;

  transform-origin:
    bottom center;

  background:
    linear-gradient(
      to top,
      rgba(255,238,177,.38),
      transparent
    );

  filter:
    blur(38px);

  opacity:.85;

}


.light1{

  left:5%;

  animation:
    light1Move
    4.3s
    ease-in-out
    infinite alternate;

}


.light2{

  right:5%;

  animation:
    light2Move
    4.8s
    ease-in-out
    infinite alternate;

}


@keyframes light1Move{

  from{
    transform:
      rotate(22deg);
  }

  to{
    transform:
      rotate(-6deg);
  }

}


@keyframes light2Move{

  from{
    transform:
      rotate(-22deg);
  }

  to{
    transform:
      rotate(8deg);
  }

}



/* ==========================================
   BIRTHDAY TITLE
========================================== */

#birthdayIntro{

  position:absolute;
  inset:0;

  z-index:10;

  display:flex;
  align-items:center;
  justify-content:center;

  transform-style:
    preserve-3d;

}


#title{

  text-align:center;

  opacity:0;

  transform:
    translateZ(-1900px)
    scale(.05)
    rotateX(9deg);

  filter:
    blur(30px);

}


#title.play{

  animation:
    titleArrival
    5.2s
    cubic-bezier(.1,.8,.2,1)
    forwards;

}


@keyframes titleArrival{

  0%{

    opacity:0;

    transform:
      translateZ(-1900px)
      scale(.05)
      rotateX(9deg);

    filter:
      blur(30px);

  }


  17%{
    opacity:1;
  }


  72%{

    transform:
      translateZ(90px)
      scale(1.07)
      rotateX(0);

    filter:
      blur(0);

  }


  100%{

    opacity:1;

    transform:
      translateZ(0)
      scale(1);

    filter:
      blur(0);

  }

}


.twenty{

  font-size:
    clamp(
      150px,
      28vw,
      370px
    );

  font-weight:900;

  line-height:.68;

  letter-spacing:-.11em;

  background:

    linear-gradient(
      180deg,
      #fffbea 0%,
      #ffe3a3 35%,
      #dba039 67%,
      #fff2c3 100%
    );

  -webkit-background-clip:
    text;

  -webkit-text-fill-color:
    transparent;

  filter:
    drop-shadow(
      0 20px 30px
      rgba(20,15,64,.46)
    );

}


.happy{

  margin-top:32px;

  font-size:
    clamp(
      17px,
      2.2vw,
      30px
    );

  letter-spacing:.38em;

  text-transform:
    uppercase;

  font-weight:800;

  color:#fff2d3;

}


.kami{

  margin-top:8px;

  font-family:
    Georgia,
    serif;

  font-style:italic;

  font-size:
    clamp(
      50px,
      8vw,
      115px
    );

}



/* ==========================================
   TITLE DISAPPEARS
========================================== */

#title.out{

  animation:
    titleOut
    .85s
    ease
    forwards;

}


@keyframes titleOut{

  to{

    opacity:0;

    transform:
      translateZ(420px)
      scale(1.3);

    filter:
      blur(20px);

  }

}



/* ==========================================
   VIDEO CINEMATIC REVEAL
========================================== */

#videoStage{

  position:absolute;
  inset:0;

  z-index:40;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;

  visibility:hidden;

}


#videoStage.active{

  opacity:1;

  visibility:visible;

}


/* darkening behind video */

.videoDark{

  position:absolute;

  inset:0;

  background:
    rgba(13,17,48,.72);

  backdrop-filter:
    blur(18px);

  opacity:0;

  transition:
    opacity .8s ease;

}


#videoStage.active
.videoDark{

  opacity:1;

}


/* initial luminous line */

#videoLine{

  position:absolute;

  width:4px;
  height:2px;

  background:white;

  box-shadow:

    0 0 25px
    8px
    rgba(255,235,180,.55);

  opacity:0;

}


#videoLine.open{

  animation:
    lineOpen
    .65s
    ease
    forwards;

}


@keyframes lineOpen{

  0%{

    opacity:0;

    width:2px;

  }


  20%{
    opacity:1;
  }


  100%{

    opacity:1;

    width:
      min(
        78vw,
        450px
      );

  }

}



/* video container */

#videoFrame{

  height:
    min(
      82vh,
      780px
    );

  aspect-ratio:
    9 / 16;

  overflow:hidden;

  position:relative;

  border-radius:30px;

  opacity:0;

  clip-path:

    inset(
      50% 0
      50% 0
      round 30px
    );

  transform:

    scale(.82)
    translateZ(-200px);

  box-shadow:

    0 45px 130px
    rgba(10,12,45,.65),

    0 0 0 1px
    rgba(255,255,255,.18);

}


#videoFrame.reveal{

  animation:

    videoReveal
    1.25s
    cubic-bezier(.14,.8,.18,1)
    forwards;

}


@keyframes videoReveal{

  0%{

    opacity:1;

    clip-path:

      inset(
        50% 0
        50% 0
        round 30px
      );

    transform:

      scale(.82)
      translateZ(-200px);

  }


  55%{

    clip-path:

      inset(
        0 0
        0 0
        round 30px
      );

  }


  100%{

    opacity:1;

    clip-path:

      inset(
        0 0
        0 0
        round 30px
      );

    transform:

      scale(1)
      translateZ(0);

  }

}


#videoFrame video{

  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

}



/* little light flash */

#flash{

  position:absolute;
  inset:0;

  z-index:60;

  background:white;

  opacity:0;

  pointer-events:none;

}


#flash.fire{

  animation:
    flash
    .55s ease;

}


@keyframes flash{

  0%{
    opacity:0;
  }

  30%{
    opacity:.65;
  }

  100%{
    opacity:0;
  }

}



/* ==========================================
   END
========================================== */

#end{

  position:absolute;
  inset:0;

  z-index:80;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  opacity:0;

  visibility:hidden;

  transition:
    opacity .8s ease;

}


#end.show{

  opacity:1;
  visibility:visible;

}


.endSmall{

  font-size:11px;

  letter-spacing:.34em;

  text-transform:
    uppercase;

  color:#fff0ce;

  margin-bottom:18px;

}


.endBig{

  font-size:
    clamp(
      60px,
      10vw,
      140px
    );

  line-height:.86;

  font-weight:900;

  letter-spacing:-.06em;

}



/* MOBILE */

@media(max-width:700px){

  #videoFrame{

    height:78vh;

    border-radius:24px;

  }

  .happy{

    letter-spacing:.22em;

  }

}

</style>
</head>



<body>


<!-- =====================================
     SECRET / SIMPLE FIRST SCREEN
===================================== -->

<section id="gate">

  <div class="gateInner">

    <div class="gateTitle">
      Are you ready?
    </div>

    <button id="yesButton">
      YES
    </button>

  </div>

</section>



<!-- =====================================
     BIRTHDAY WORLD
===================================== -->

<div id="world">


<div class="haze haze1"></div>
<div class="haze haze2"></div>


<div class="light light1"></div>
<div class="light light2"></div>


<span
class="spark"
style="left:8%;top:18%;animation-delay:.2s">
</span>

<span
class="spark"
style="left:18%;top:65%;animation-delay:1.4s">
</span>

<span
class="spark"
style="left:29%;top:25%;animation-delay:2.1s">
</span>

<span
class="spark"
style="left:69%;top:17%;animation-delay:.7s">
</span>

<span
class="spark"
style="left:83%;top:62%;animation-delay:2.5s">
</span>

<span
class="spark"
style="left:92%;top:34%;animation-delay:1.2s">
</span>


<div id="blackout"></div>



<!-- INTRO SOUND ONLY -->

<video

id="introVideo"

playsinline

preload="auto"

style="
position:absolute;
width:1px;
height:1px;
opacity:0;
pointer-events:none;
"

>

<source

src="entry-video.mp4"

type="video/mp4"

>

</video>



<!-- TITLE -->

<section id="birthdayIntro">

  <div id="title">

    <div class="twenty">
      20
    </div>

    <div class="happy">
      Happy Birthday
    </div>

    <div class="kami">
      Kami
    </div>

  </div>

</section>



<!-- ENTRY TALK -->

<section id="videoStage">

<div class="videoDark"></div>

<div id="videoLine"></div>


<div id="videoFrame">

<video

id="entryTalk"

playsinline

preload="auto"

>

<source

src="entry-talk.mp4"

type="video/mp4"

>

</video>

</div>

</section>



<div id="flash"></div>



<!-- END -->

<section id="end">

<div>

<div class="endSmall">
This is only the beginning
</div>

<div class="endBig">
Ready,<br>Kami?
</div>

</div>

</section>


</div>



<script>


const gate =
document.getElementById(
"gate"
);


const yesButton =
document.getElementById(
"yesButton"
);


const blackout =
document.getElementById(
"blackout"
);


const introVideo =
document.getElementById(
"introVideo"
);


const title =
document.getElementById(
"title"
);


const videoStage =
document.getElementById(
"videoStage"
);


const videoLine =
document.getElementById(
"videoLine"
);


const videoFrame =
document.getElementById(
"videoFrame"
);


const entryTalk =
document.getElementById(
"entryTalk"
);


const flash =
document.getElementById(
"flash"
);


const end =
document.getElementById(
"end"
);


let started = false;

let introFinished = false;



function wait(ms){

return new Promise(

resolve =>

setTimeout(
resolve,
ms
)

);

}



/* ======================================
   YES
====================================== */

yesButton.addEventListener(

"click",

async ()=>{


if(started)
return;


started = true;


/*
Unlock sound first
*/

introVideo.currentTime = 0;

introVideo.volume = 1;

introVideo.muted = false;

introVideo.loop = false;


try{

await introVideo.play();

}

catch(error){

console.log(
error
);

}


/*
Leave the innocent first screen
*/

gate.classList.add(
"leave"
);


/*
Short cinematic darkness
*/

await wait(600);


blackout.classList.add(
"remove"
);


/*
Birthday reveal
*/

await wait(250);


title.classList.add(
"play"
);


}

);



/* ======================================
   WHEN INTRO AUDIO FINISHES
====================================== */

async function finishIntro(){


if(introFinished)
return;


introFinished = true;


/*
Birthday title flies toward viewer
*/

title.classList.add(
"out"
);


await wait(900);


/*
Darken scene
*/

videoStage.classList.add(
"active"
);


await wait(550);


/*
Tiny line appears
*/

videoLine.classList.add(
"open"
);


await wait(650);


/*
Flash as the video opens
*/

flash.classList.add(
"fire"
);


await wait(100);


/*
Video opens vertically
*/

videoFrame.classList.add(
"reveal"
);


/*
Start Panagiotis video
*/

entryTalk.currentTime = 0;

entryTalk.volume = 1;

entryTalk.muted = false;

entryTalk.loop = false;


try{

await entryTalk.play();

}

catch(error){

console.log(
error
);

}


}



introVideo.addEventListener(
"ended",
finishIntro
);



/* safety */

introVideo.addEventListener(

"timeupdate",

()=>{


if(

!introFinished

&&

Number.isFinite(
introVideo.duration
)

&&

introVideo.duration > 0

&&

introVideo.currentTime
>=
introVideo.duration - .12

){

finishIntro();

}


}

);



/* ======================================
   ENTRY TALK FINISHES
====================================== */

entryTalk.addEventListener(

"ended",

async ()=>{


videoFrame.style.transition =
"opacity .8s ease, transform .8s ease";


videoFrame.style.opacity =
"0";


videoFrame.style.transform =
"scale(1.10)";


await wait(850);


videoStage.classList.remove(
"active"
);


await wait(350);


end.classList.add(
"show"
);


}

);


</script>

</body>
</html>
