<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kami</title>
  
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#10152f;
  color:white;
}

button{
  font:inherit;
}

/* =====================================
   FIRST SCREEN
===================================== */

#gate{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at 50% 35%,rgba(100,110,170,.15),transparent 28%),
    linear-gradient(160deg,#10152f 0%,#171d3f 55%,#20274f 100%);

  transition:
    opacity .7s ease,
    transform .8s ease,
    visibility .7s ease;
}

#gate.leave{
  opacity:0;
  transform:scale(1.08);
  visibility:hidden;
}

.gateInner{
  text-align:center;
  padding:24px;
}

.gateTitle{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(44px,11vw,86px);
  font-weight:400;
  letter-spacing:-.04em;
  color:#f4f1ea;
}

#yesButton{
  margin-top:30px;

  padding:14px 34px;

  border-radius:999px;

  border:
    1px solid
    rgba(255,255,255,.22);

  background:
    rgba(255,255,255,.06);

  color:#f4f1ea;

  font-size:14px;
  letter-spacing:.16em;

  cursor:pointer;

  transition:.25s;
}

#yesButton:hover{
  background:#f4f1ea;
  color:#141832;
}

/* =====================================
   MAIN WORLD
===================================== */

#world{
  position:fixed;
  inset:0;
  overflow:hidden;

  perspective:1500px;

  background:
    radial-gradient(circle at 50% 20%,rgba(255,221,166,.22),transparent 24%),
    radial-gradient(circle at 15% 72%,rgba(236,133,192,.25),transparent 32%),
    radial-gradient(circle at 85% 28%,rgba(105,124,235,.28),transparent 36%),
    linear-gradient(145deg,#17265d 0%,#304f9b 36%,#6c58b3 68%,#c375a6 100%);
}

#blackout{
  position:absolute;
  inset:0;

  z-index:100;

  background:#11162f;

  transition:opacity .9s ease;
}

#blackout.remove{
  opacity:0;
}

/* =====================================
   BACKGROUND HAZE
===================================== */

.haze{
  position:absolute;
  inset:-25%;

  filter:blur(70px);

  opacity:.55;
}

.haze1{
  background:
    radial-gradient(circle at 25% 42%,rgba(255,176,213,.62),transparent 31%);

  animation:
    hazeA
    11s
    ease-in-out
    infinite alternate;
}

.haze2{
  background:
    radial-gradient(circle at 75% 40%,rgba(110,130,255,.52),transparent 34%);

  animation:
    hazeB
    13s
    ease-in-out
    infinite alternate;
}

@keyframes hazeA{
  to{
    transform:
      translate(7%,-4%)
      scale(1.08);
  }
}

@keyframes hazeB{
  to{
    transform:
      translate(-5%,5%)
      scale(1.1);
  }
}

/* =====================================
   SEARCHLIGHTS
===================================== */

.light{
  position:absolute;
  bottom:-45%;

  width:220px;
  height:165%;

  transform-origin:bottom center;

  background:
    linear-gradient(
      to top,
      rgba(255,236,173,.34),
      transparent
    );

  filter:blur(32px);

  opacity:.8;

  z-index:2;
}

.light1{
  left:-20px;
  animation:
    moveLight1
    4.2s
    ease-in-out
    infinite alternate;
}

.light2{
  right:-20px;
  animation:
    moveLight2
    4.6s
    ease-in-out
    infinite alternate;
}

.light3{
  left:42%;
  opacity:.25;
  animation:
    moveLight3
    5.2s
    ease-in-out
    infinite alternate;
}

@keyframes moveLight1{
  from{transform:rotate(25deg)}
  to{transform:rotate(-5deg)}
}

@keyframes moveLight2{
  from{transform:rotate(-25deg)}
  to{transform:rotate(8deg)}
}

@keyframes moveLight3{
  from{transform:rotate(-7deg)}
  to{transform:rotate(10deg)}
}

/* =====================================
   SPARKS
===================================== */

.spark{
  position:absolute;

  width:4px;
  height:4px;

  border-radius:50%;

  background:#fff4c5;

  box-shadow:
    0 0 14px
    4px
    rgba(255,224,150,.48);

  opacity:0;

  animation:
    twinkle
    3.8s
    ease-in-out
    infinite;

  z-index:3;
}

@keyframes twinkle{
  0%,100%{
    opacity:0;
    transform:scale(.3);
  }

  50%{
    opacity:1;
    transform:scale(1.2);
  }
}

/* =====================================
   BIRTHDAY TITLE
===================================== */

#birthdayIntro{
  position:absolute;
  inset:0;

  z-index:10;

  display:flex;
  align-items:center;
  justify-content:center;

  transform-style:preserve-3d;
}

.titleGroup{
  position:relative;

  width:min(92vw,560px);
  height:min(68vh,620px);

  opacity:0;

  transform:
    translateZ(-1500px)
    scale(.08);

  filter:blur(26px);
}

.titleGroup.play{
  animation:
    groupArrival
    5.2s
    cubic-bezier(.12,.8,.18,1)
    forwards;
}

@keyframes groupArrival{
  0%{
    opacity:0;
    transform:
      translateZ(-1500px)
      scale(.08);
    filter:blur(26px);
  }

  15%{
    opacity:1;
  }

  72%{
    transform:
      translateZ(80px)
      scale(1.04);
    filter:blur(0);
  }

  100%{
    opacity:1;
    transform:
      translateZ(0)
      scale(1);
    filter:blur(0);
  }
}

/* 20 AS DESIGN ELEMENT */

.twenty{
  position:absolute;

  left:-3%;
  top:50%;

  transform:
    translateY(-50%)
    rotate(-7deg);

  font-size:clamp(170px,45vw,330px);

  font-weight:900;

  letter-spacing:-.12em;

  line-height:.7;

  background:
    linear-gradient(
      180deg,
      #fff9df 0%,
      #ffe19f 36%,
      #dca03e 68%,
      #fff2c3 100%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  opacity:.92;

  filter:
    drop-shadow(
      0 18px 26px
      rgba(25,16,70,.4)
    )
    drop-shadow(
      0 0 28px
      rgba(255,223,146,.18)
    );
}

/* MAIN TEXT */

.words{
  position:absolute;

  right:4%;
  top:50%;

  transform:
    translateY(-50%);

  width:66%;

  text-align:right;

  z-index:4;
}

.happy{
  font-size:clamp(17px,4.3vw,26px);

  letter-spacing:.22em;

  text-transform:uppercase;

  color:#fff1cf;

  font-weight:800;

  text-shadow:
    0 8px 24px
    rgba(20,15,65,.35);
}

.kami{
  margin-top:10px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-style:italic;

  font-size:clamp(62px,16vw,108px);

  line-height:.9;

  color:white;

  text-shadow:
    0 14px 38px
    rgba(20,15,65,.35),
    0 0 24px
    rgba(255,228,180,.15);
}

/* EXTRA GLOW AROUND LETTERS */

.wordGlow{
  position:absolute;

  right:-10%;
  top:45%;

  width:75%;
  height:42%;

  transform:
    translateY(-50%);

  background:
    radial-gradient(
      ellipse,
      rgba(255,225,170,.27),
      transparent 65%
    );

  filter:blur(24px);

  z-index:1;
}

/* LIGHT STREAKS AROUND TEXT */

.streak{
  position:absolute;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,245,205,.9),
      transparent
    );

  filter:blur(.5px);

  opacity:.8;
}

.streak.one{
  width:65%;
  top:35%;
  left:22%;
  transform:rotate(-8deg);
}

.streak.two{
  width:55%;
  top:64%;
  left:36%;
  transform:rotate(7deg);
}

.streak.three{
  width:42%;
  top:48%;
  left:48%;
  transform:rotate(-2deg);
}

/* TITLE EXIT */

.titleGroup.out{
  animation:
    titleOut
    .85s
    ease
    forwards;
}

@keyframes titleOut{
  to{
    opacity:0;

    transform:
      translateZ(300px)
      scale(1.16);

    filter:blur(15px);
  }
}

/* =====================================
   AND NOW
===================================== */

#bridge{
  position:absolute;
  inset:0;

  z-index:20;

  display:grid;
  place-items:center;

  opacity:0;
  visibility:hidden;

  transition:.45s ease;
}

#bridge.show{
  opacity:1;
  visibility:visible;
}

.bridgeText{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-style:italic;

  font-size:clamp(40px,11vw,72px);

  color:#fff0d5;

  text-shadow:
    0 12px 34px
    rgba(20,15,70,.38);
}

/* =====================================
   VIDEO REVEAL
===================================== */

#videoStage{
  position:absolute;
  inset:0;

  z-index:40;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;
  visibility:hidden;

  transition:opacity .5s ease;
}

#videoStage.active{
  opacity:1;
  visibility:visible;
}

.videoDark{
  position:absolute;
  inset:0;

  background:
    rgba(14,17,48,.68);

  backdrop-filter:
    blur(16px);

  opacity:0;

  transition:.7s ease;
}

#videoStage.active .videoDark{
  opacity:1;
}

/* LIGHT LINE */

#videoLine{
  position:absolute;

  width:2px;
  height:3px;

  background:#fff5cf;

  box-shadow:
    0 0 25px
    8px
    rgba(255,230,174,.5);

  opacity:0;
}

#videoLine.open{
  animation:
    lineOpen
    .65s
    ease
    forwards;
}

@keyframes lineOpen{
  0%{
    opacity:0;
    width:2px;
  }

  20%{
    opacity:1;
  }

  100%{
    opacity:1;
    width:min(78vw,390px);
  }
}

/* VIDEO */

#videoFrame{
  position:relative;

  width:min(78vw,390px);

  aspect-ratio:9/16;

  overflow:hidden;

  border-radius:28px;

  opacity:0;

  clip-path:
    inset(
      50% 0
      50% 0
      round 28px
    );

  transform:
    scale(.78)
    translateZ(-220px);

  box-shadow:
    0 38px 110px
    rgba(10,12,45,.6),
    0 0 0 1px
    rgba(255,255,255,.18);
}

#videoFrame.reveal{
  animation:
    videoReveal
    1.25s
    cubic-bezier(.14,.8,.18,1)
    forwards;
}

@keyframes videoReveal{
  0%{
    opacity:1;

    clip-path:
      inset(
        50% 0
        50% 0
        round 28px
      );

    transform:
      scale(.78)
      translateZ(-220px);
  }

  55%{
    clip-path:
      inset(
        0 0
        0 0
        round 28px
      );
  }

  100%{
    opacity:1;

    clip-path:
      inset(
        0 0
        0 0
        round 28px
      );

    transform:
      scale(1)
      translateZ(0);
  }
}

#videoFrame video{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  background:#000;
}

/* FLASH */

#flash{
  position:absolute;
  inset:0;

  z-index:60;

  background:white;

  opacity:0;

  pointer-events:none;
}

#flash.fire{
  animation:
    flash
    .5s
    ease;
}

@keyframes flash{
  0%{opacity:0}
  30%{opacity:.5}
  100%{opacity:0}
}

/* =====================================
   FINAL
===================================== */

#end{
  position:absolute;
  inset:0;

  z-index:80;

  display:grid;
  place-items:center;

  text-align:center;

  opacity:0;
  visibility:hidden;

  transition:.8s ease;
}

#end.show{
  opacity:1;
  visibility:visible;
}

.endSmall{
  font-size:11px;

  letter-spacing:.32em;

  text-transform:uppercase;

  color:#fff0ce;

  margin-bottom:18px;
}

.endBig{
  font-size:clamp(58px,15vw,110px);

  line-height:.86;

  font-weight:900;

  letter-spacing:-.06em;
}

/* =====================================
   MOBILE
===================================== */

@media(max-width:600px){

  .titleGroup{
    width:94vw;
    height:64vh;
  }

  .twenty{
    left:-8%;
    top:53%;

    font-size:55vw;
  }

  .words{
    right:5%;
    width:68%;
  }

  .happy{
    font-size:4vw;
    letter-spacing:.17em;
  }

  .kami{
    font-size:17vw;
  }

  #videoFrame{
    width:82vw;
    max-height:76vh;
  }

  #videoLine.open{
    width:82vw;
  }

}

</style>
</head>

<body>

<!-- FIRST SCREEN -->

<section id="gate">

  <div class="gateInner">

    <div class="gateTitle">
      Are you ready?
    </div>

    <button id="yesButton">
      YES
    </button>

  </div>

</section>


<!-- MAIN WORLD -->

<div id="world">

  <div id="blackout"></div>

  <div class="haze haze1"></div>
  <div class="haze haze2"></div>

  <div class="light light1"></div>
  <div class="light light2"></div>
  <div class="light light3"></div>

  <span class="spark" style="left:8%;top:18%;animation-delay:.2s"></span>
  <span class="spark" style="left:18%;top:63%;animation-delay:1.1s"></span>
  <span class="spark" style="left:29%;top:27%;animation-delay:2.1s"></span>
  <span class="spark" style="left:67%;top:18%;animation-delay:.7s"></span>
  <span class="spark" style="left:81%;top:64%;animation-delay:2.5s"></span>
  <span class="spark" style="left:92%;top:32%;animation-delay:1.3s"></span>


  <!-- HIDDEN INTRO VIDEO / SOUND -->

  <video
    id="introVideo"
    playsinline
    preload="auto"
    style="
      position:absolute;
      width:1px;
      height:1px;
      opacity:0;
      pointer-events:none;
    "
  >
    <source src="entry-video.mp4" type="video/mp4">
  </video>


  <!-- BIRTHDAY INTRO -->

  <section id="birthdayIntro">

    <div class="titleGroup" id="titleGroup">

      <div class="twenty">
        20
      </div>

      <div class="wordGlow"></div>

      <div class="streak one"></div>
      <div class="streak two"></div>
      <div class="streak three"></div>

      <div class="words">

        <div class="happy">
          Happy Birthday
        </div>

        <div class="kami">
          Kami
        </div>

      </div>

    </div>

  </section>


  <!-- AND NOW -->

  <section id="bridge">

    <div class="bridgeText">
      And now...
    </div>

  </section>


  <!-- VIDEO -->

  <section id="videoStage">

    <div class="videoDark"></div>

    <div id="videoLine"></div>

    <div id="videoFrame">

      <video
        id="entryTalk"
        playsinline
        preload="auto"
      >

        <source
          src="entry-talk.mp4"
          type="video/mp4"
        >

      </video>

    </div>

  </section>


  <div id="flash"></div>


  <!-- FINAL -->

  <section id="end">

    <div>

      <div class="endSmall">
        This is only the beginning
      </div>

      <div class="endBig">
        Ready,<br>Kami?
      </div>

    </div>

  </section>

</div>


<script>

const gate =
document.getElementById("gate");

const yesButton =
document.getElementById("yesButton");

const blackout =
document.getElementById("blackout");

const introVideo =
document.getElementById("introVideo");

const titleGroup =
document.getElementById("titleGroup");

const bridge =
document.getElementById("bridge");

const videoStage =
document.getElementById("videoStage");

const videoLine =
document.getElementById("videoLine");

const videoFrame =
document.getElementById("videoFrame");

const entryTalk =
document.getElementById("entryTalk");

const flash =
document.getElementById("flash");

const end =
document.getElementById("end");


let started = false;
let introFinished = false;


function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );

}


/* YES BUTTON */

yesButton.addEventListener(
"click",
async ()=>{

  if(started) return;

  started = true;


  introVideo.currentTime = 0;
  introVideo.volume = 1;
  introVideo.muted = false;
  introVideo.loop = false;


  try{

    await introVideo.play();

  }

  catch(error){

    console.log(error);

  }


  gate.classList.add("leave");


  await wait(500);


  blackout.classList.add("remove");


  await wait(250);


  titleGroup.classList.add("play");

});


/* INTRO ENDS */

async function finishIntro(){

  if(introFinished) return;

  introFinished = true;


  titleGroup.classList.add("out");


  await wait(850);


  bridge.classList.add("show");


  await wait(1500);


  bridge.classList.remove("show");


  await wait(450);


  videoStage.classList.add("active");


  await wait(450);


  videoLine.classList.add("open");


  await wait(600);


  flash.classList.add("fire");


  await wait(100);


  videoFrame.classList.add("reveal");


  entryTalk.currentTime = 0;
  entryTalk.volume = 1;
  entryTalk.muted = false;
  entryTalk.loop = false;


  try{

    await entryTalk.play();

  }

  catch(error){

    console.log(error);

  }

}


introVideo.addEventListener(
"ended",
finishIntro
);


/* safety */

introVideo.addEventListener(
"timeupdate",
()=>{

  if(
    !introFinished
    &&
    Number.isFinite(introVideo.duration)
    &&
    introVideo.duration > 0
    &&
    introVideo.currentTime
    >=
    introVideo.duration - .12
  ){

    finishIntro();

  }

});


/* ENTRY TALK ENDS */

entryTalk.addEventListener(
"ended",
async ()=>{

  videoFrame.style.transition =
    "opacity .8s ease, transform .8s ease";


  videoFrame.style.opacity =
    "0";


  videoFrame.style.transform =
    "scale(1.08)";


  await wait(850);


  videoStage.classList.remove(
    "active"
  );


  await wait(350);


  end.classList.add(
    "show"
  );

});

</script>

</body>
</html>
